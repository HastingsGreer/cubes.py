<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        font-family: system-ui;
      }
      span {
        color: #aaa;
        font-size: 3em;
        font-weight: bold;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        user-select: none;
      }
      body {
        display: flex;
        height: 100dvh;
      }
      #workspace {
        flex: 1;
        position: relative;
        background: #f5f5f5;
	touch-action: none;
      }
      #sidebar {
        width: 428px;
        padding: 10px;
        overflow-y: auto;
	overscroll-behavior: contain;
        border-left: 1px solid #ccc;
        background: #fff;
      }
	@media (max-width: 1000px) {
		#sidebar {
			width: 128px;
		}
	}
      .item {
        display: inline-block;
        margin: 3px;
        background: #333;
        border: 1px solid #ddd;
        border-radius: 4px;
        cursor: grab;
	touch-action: none;
        padding: 4px;
      }
      #workspace .item {
        position: absolute;
      }
    </style>
  </head>
  <body>
    <div id="workspace">
      <span>
        F&nbsp;i&nbsp;n&nbsp;i&nbsp;t&nbsp;e C&nbsp;r&nbsp;a&nbsp;f&nbsp;t
      </span>
    </div>
    <div id="sidebar"></div>
    <script src="output.js"></script>
    <script src="numeric.min.js"></script>
    <script src="index.js"></script>
  </body>
</html>
