<!doctype html>
<html>
  <head>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        font-family: system-ui;
      }
      span {
        color: #aaa;
        font-size: 3em;
        font-style: bold;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        user-select: none;
      }
      body {
        display: flex;
        height: 100vh;
      }
      #workspace {
        flex: 1;
        position: relative;
        background: #f5f5f5;
      }
      #sidebar {
        width: 128px;
        padding: 10px;
        overflow-y: auto;
        border-left: 1px solid #ccc;
	background: #fff;
      }
      .item {
        display: inline-block;
        margin: 3px;
        background: #333;
        border: 1px solid #ddd;
        border-radius: 4px;
        cursor: grab;
        padding: 4px;
      }
      #workspace .item {
        position: absolute;
      }
    </style>
  </head>
  <body>
    <div id="workspace"><span>
F&nbsp;i&nbsp;n&nbsp;i&nbsp;t&nbsp;e C&nbsp;r&nbsp;a&nbsp;f&nbsp;t
	    </span></div>
    <div id="sidebar"></div>
    <script src="output.js"></script>
    <script src="numeric.min.js"></script>
    <script>
      let dragged = null;
      let last = [100, 100];
      let lastClickOffset = [100, 100];
      let clickstart = [-100, -100];
      let clickoffset = [-100, -100];

      function createItem(matrix) {
        const el = document.createElement("div");
        el.className = "item";
        el.innerHTML = getCube(matrix);
        el.dataset.moves = JSON.stringify(matrix);
        el.onmousedown = (e) => {
	  clickstart = [e.clientX, e.clientY];
		var el_rect = el.getBoundingClientRect();
	  clickoffset = [e.clientX - el_rect.left + 3, e.clientY - el_rect.top + 3];
          dragged = { matrix, el: el.cloneNode(true) };
          dragged.el.style.position = "absolute";
		console.log(clickoffset);
          dragged.el.style.left = e.clientX - clickoffset[0] + "px";
          dragged.el.style.top = e.clientY - clickoffset[1] + "px";
          document.body.appendChild(dragged.el);
          if (el.parentElement.id === "workspace" && e.button === 0)
            el.remove();
          e.preventDefault();
        };
        el.oncontextmenu = (e) => e.preventDefault();
        return el;
      }

      function renderSidebar() {
        sidebar.innerHTML = "";
        discovered.forEach((t) => sidebar.appendChild(createItem(t)));
      }

      document.onmousemove = (e) => {
        if (dragged) {
          dragged.el.style.left = e.clientX - clickoffset[0] + "px";
          dragged.el.style.top = e.clientY - clickoffset[1] + "px";
        }
      };

      document.onmouseup = (e) => {
        if (!dragged) return;
        var x = e.clientX,
          y = e.clientY;

	      var is_click = 0
	if (Math.abs(x - clickstart[0]) + Math.abs(y - clickstart[1]) < 8) {
		console.log("no drag");
		x = last[0];
		y = last[1];
		is_click = 1;
	}
      last = [x, y];
      
        dragged.el.remove();

        if (x < workspace.offsetWidth) {

          const target = [...workspace.querySelectorAll(".item")].find((el) => {
            const r = el.getBoundingClientRect();
            return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
          });

          if (target) {
		  if (is_click) {
			  if (e.clientX < workspace.offsetWidth) {
            const item = createItem(dragged.matrix);
            item.style.left = e.clientX - clickoffset[0] + "px";
            item.style.top = e.clientY - clickoffset[1] + "px";
				  workspace.appendChild(item);}
		  }
            const combined = numeric.dot(
              JSON.parse(target.dataset.moves),
              dragged.matrix,
            );
            x = target.style.left;
            y = target.style.top;
            var oldLocations = numeric.dot(
              JSON.parse(target.dataset.moves),
              coords,
            );
            target.remove();
            if (
              !discovered.some((old_matrix) => {
                return JSON.stringify(old_matrix) === JSON.stringify(combined);
              })
            ) {
              discovered.push(combined);
              discovered.sort(
                (a, b) =>
                  numeric.sum(
                    numeric.abs(numeric.sub(a, numeric.identity(54))),
                  ) -
                  numeric.sum(
                    numeric.abs(numeric.sub(b, numeric.identity(54))),
                  ),
              );
            }

            renderSidebar();
            const item = createItem(combined);
            item.style.left = x;
            item.style.top = y;
            var newLocations = numeric.dot(combined, coords);
            var stickers = [...item.firstElementChild.children];
            stickers.forEach((sticker, i) => {
              sticker.style.transition =
                "left 0.3s ease-out, top 0.3s ease-out";
            });
            stickers.forEach((sticker, i) => {
              sticker.style.left = oldLocations[i][1] + "px";
              sticker.style.top = oldLocations[i][2] + "px";
              sticker.style.zIndex = Math.round(oldLocations[i][0]);
            });
            setTimeout(() => {
              stickers.forEach((sticker, i) => {
                sticker.style.left = newLocations[i][1] + "px";
                sticker.style.top = newLocations[i][2] + "px";
                sticker.style.zIndex = Math.round(newLocations[i][0]);
              });
            }, 20);
            workspace.appendChild(item);
          } else {
            const item = createItem(dragged.matrix);
            item.style.left = x - clickoffset[0] + "px";
            item.style.top = y - clickoffset[1] + "px";
            workspace.appendChild(item);
          }
        }
        dragged = null;
      };

      renderSidebar();
      document.oncontextmenu = (e) => e.preventDefault();
    </script>
  </body>
</html>
